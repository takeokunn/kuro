name: Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check release version consistency
        shell: bash
        run: |
          VERSION="$(perl -ne 'print $1 if /^version = "([^"]+)"/' Cargo.toml)"
          bash scripts/check-release-version.sh "v${VERSION}"
      - name: Run nix flake check
        run: nix flake check

  security:
    name: Cargo security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Audit Rust dependencies
        run: nix develop --command cargo audit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Rust core (from Nix cache)
        run: nix build .#kuro-core --out-link result
      - name: Run E2E tests
        run: |
          KURO_MODULE_PATH="$(realpath result/lib)" \
            nix develop --command bash test/scripts/runners/run-e2e.sh
