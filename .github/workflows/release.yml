# Release native module
#
# Trigger:
#   - Tag push matching `v*` (e.g. `v1.0.0`)
#   - Manual `workflow_dispatch` with explicit `tag` input (for re-running a
#     previously-pushed tag without retagging).
#
# What it produces:
#   For each supported target triple, builds the `kuro-core` cdylib in release
#   mode and uploads two artifacts to the GitHub Release for the tag:
#     - libkuro_core-<VERSION>-<TARGET>.tar.gz          (contains the native library)
#     - libkuro_core-<VERSION>-<TARGET>.tar.gz.sha256   (sha256 of the tarball)
#
#   Targets:
#     - x86_64-unknown-linux-gnu   (ubuntu-latest, native)
#     - aarch64-unknown-linux-gnu  (ubuntu-22.04-arm, native aarch64 runner)
#     - x86_64-apple-darwin         (macos-15-intel, native)
#     - aarch64-apple-darwin        (macos-15, native)
#
# How Elisp consumes it:
#   The companion Elisp loader fetches
#     https://github.com/takeokunn/kuro/releases/download/v<VERSION>/libkuro_core-<VERSION>-<TARGET>.tar.gz
#   plus the matching `.sha256`, verifies the hash, untars, and dlopens
#   the platform-specific native library from the resulting directory.
#
# Design notes:
#   - Raw cargo (no Nix) for portability and speed.
#   - MSRV pinned to 1.84.0 (matches Cargo.toml workspace.package.rust-version).
#   - Release profile (lto=fat, codegen-units=1, strip=symbols) already set in
#     workspace Cargo.toml — no extra flags needed.
#   - Third-party Actions are pinned to immutable commit SHAs.

name: Release native module

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)release, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          bash scripts/check-release-version.sh "$TAG"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "release commit must be reachable from origin/main" >&2
            exit 1
          }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust security audit tooling
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo audit

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  lib: libkuro_core.so }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, lib: libkuro_core.so }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       lib: libkuro_core.dylib }
          - { os: macos-15,         target: aarch64-apple-darwin,      lib: libkuro_core.dylib }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain (1.84.0)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.84.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build cdylib (release)
        run: |
          cargo build --release \
            --target ${{ matrix.target }} \
            --manifest-path rust-core/Cargo.toml

      - name: Determine version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package tarball + sha256
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TARGET="${{ matrix.target }}"
          LIB="${{ matrix.lib }}"
          OUT="libkuro_core-${VERSION}-${TARGET}.tar.gz"

          tar -C "target/${TARGET}/release" -czf "${OUT}" "${LIB}"
          perl -MDigest::SHA=sha256_hex -e '
            local $/;
            open my $fh, "<:raw", $ARGV[0] or die "$ARGV[0]: $!\n";
            print sha256_hex(<$fh>), "\n";
          ' "${OUT}" > "${OUT}.sha256"
          ls -la "${OUT}" "${OUT}.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: kuro-${{ matrix.target }}
          path: |
            libkuro_core-*.tar.gz
            libkuro_core-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: kuro-*
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la dist/

      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e  # v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: |
            dist/libkuro_core-*.tar.gz
            dist/libkuro_core-*.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
